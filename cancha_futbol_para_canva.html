<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cancha de Fútbol</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f0;color:#18352b;font-family:Arial,sans-serif}header{background:#176344;color:white;padding:18px;text-align:center}h1{margin:0;font-size:28px}main{max-width:1100px;margin:auto;padding:14px}section{background:white;border-radius:16px;padding:14px;box-shadow:0 5px 18px #0001}.sub{color:#547064;margin:4px 0 12px;font-size:14px}.canvas{overflow:hidden;background:#e6eee8;border-radius:12px;padding:5px}svg{display:block;width:100%;height:auto}.clickable{cursor:pointer}.clickable:hover{filter:brightness(1.12)}.measure{font-size:14px;font-weight:bold;fill:#18352b;paint-order:stroke;stroke:#fff;stroke-width:4px}.info{margin-top:10px;min-height:55px;border-left:4px solid #e4a72f;background:#f7f8f4;padding:10px 14px;border-radius:8px}.info strong{display:block;margin-bottom:4px}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.legend span{font-size:12px;background:#eef4ef;padding:6px 9px;border-radius:20px}@media(max-width:600px){main{padding:7px}h1{font-size:22px}}</style></head><body><header><h1>⚽ Cancha de Fútbol</h1></header><main><section><p class="sub">Vista desde arriba · haz clic en el campo, áreas, círculo, punto penal o portería.</p><div class="canvas"><svg viewBox="0 0 1000 600"><rect x="40" y="40" width="920" height="520" fill="#2d7548"/><rect x="70" y="65" width="860" height="470" fill="#3c9b5c" stroke="#fff" stroke-width="4" class="clickable" data-title="Campo de fútbol" data-detail="90–120 m de largo × 45–90 m de ancho. Internacional: 100–110 m × 64–75 m."/><line x1="500" y1="65" x2="500" y2="535" stroke="#fff" stroke-width="4" class="clickable" data-title="Línea de medio campo" data-detail="Divide el terreno en dos mitades."/><circle cx="500" cy="300" r="71" fill="none" stroke="#fff" stroke-width="4" class="clickable" data-title="Círculo central" data-detail="Radio: 9,15 m."/><rect x="70" y="182" width="145" height="236" fill="none" stroke="#fff" stroke-width="4" class="clickable" data-title="Área penal" data-detail="16,5 m de profundidad × 40,32 m de ancho."/><rect x="785" y="182" width="145" height="236" fill="none" stroke="#fff" stroke-width="4" class="clickable" data-title="Área penal" data-detail="16,5 m de profundidad × 40,32 m de ancho."/><rect x="70" y="240" width="48" height="120" fill="none" stroke="#fff" stroke-width="4" class="clickable" data-title="Área de meta" data-detail="5,5 m de profundidad × 18,32 m de ancho."/><rect x="882" y="240" width="48" height="120" fill="none" stroke="#fff" stroke-width="4" class="clickable" data-title="Área de meta" data-detail="5,5 m de profundidad × 18,32 m de ancho."/><circle cx="169" cy="300" r="4" fill="#fff" class="clickable" data-title="Punto penal" data-detail="11 m desde la línea de meta."/><circle cx="831" cy="300" r="4" fill="#fff" class="clickable" data-title="Punto penal" data-detail="11 m desde la línea de meta."/><g class="clickable" data-title="Arco / portería" data-detail="7,32 m de ancho × 2,44 m de alto."><rect x="48" y="240" width="22" height="120" fill="#fff"/><path d="M48 250H25V350H48M25 270H48M25 290H48M25 310H48M25 330H48M36 250V350" stroke="#ccd5ce" fill="none"/><rect x="930" y="240" width="22" height="120" fill="#fff"/><path d="M952 250H975V350H952M952 270H975M952 290H975M952 310H975M952 330H975M964 250V350" stroke="#ccd5ce" fill="none"/></g><g stroke="#244b39" stroke-width="2" fill="none"><path d="M70 30V55M930 30V55M70 42H930"/><path d="M25 65H58M25 535H58M38 65V535"/></g><g class="measure"><text x="500" y="30" text-anchor="middle">90–120 m</text><text x="18" y="300" text-anchor="middle" transform="rotate(-90 18 300)">45–90 m</text><text x="500" y="390" text-anchor="middle">R 9,15 m</text></g></svg></div><div class="legend"><span>90–120 × 45–90 m</span><span>Área penal: 16,5 × 40,32 m</span><span>Punto penal: 11 m</span><span>Portería: 7,32 × 2,44 m</span></div><div class="info" id="infoF"><strong>Selecciona una parte</strong><span>Haz clic con el mouse sobre la cancha, líneas, red, arco o área para ver sus medidas.</span></div></section></main><script>document.querySelectorAll(".clickable").forEach(e=>e.onclick=()=>{document.getElementById("infoF").innerHTML="<strong>"+e.dataset.title+"</strong><span>"+e.dataset.detail+"</span>"})</script></body></html>
