<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cancha de Vóley</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f0;color:#18352b;font-family:Arial,sans-serif}header{background:#176344;color:white;padding:18px;text-align:center}h1{margin:0;font-size:28px}main{max-width:1100px;margin:auto;padding:14px}section{background:white;border-radius:16px;padding:14px;box-shadow:0 5px 18px #0001}.sub{color:#547064;margin:4px 0 12px;font-size:14px}.canvas{overflow:hidden;background:#e6eee8;border-radius:12px;padding:5px}svg{display:block;width:100%;height:auto}.clickable{cursor:pointer}.clickable:hover{filter:brightness(1.12)}.measure{font-size:14px;font-weight:bold;fill:#18352b;paint-order:stroke;stroke:#fff;stroke-width:4px}.info{margin-top:10px;min-height:55px;border-left:4px solid #e4a72f;background:#f7f8f4;padding:10px 14px;border-radius:8px}.info strong{display:block;margin-bottom:4px}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.legend span{font-size:12px;background:#eef4ef;padding:6px 9px;border-radius:20px}@media(max-width:600px){main{padding:7px}h1{font-size:22px}}</style></head><body><header><h1>🏐 Cancha de Vóley</h1></header><main><section><p class="sub">Vista desde arriba · haz clic en cualquier elemento para consultar sus medidas.</p><div class="canvas"><svg viewBox="0 0 900 520"><rect x="55" y="45" width="790" height="430" rx="4" fill="#d9e7dc"/><rect x="145" y="100" width="610" height="305" fill="#e5a35b" stroke="#fff" stroke-width="5" class="clickable" data-title="Cancha de vóley" data-detail="18 m de largo × 9 m de ancho."/><line x1="450" y1="100" x2="450" y2="405" stroke="#fff" stroke-width="5" class="clickable" data-title="Línea central" data-detail="Divide la cancha en dos campos de 9 × 9 m."/><line x1="246.7" y1="100" x2="246.7" y2="405" stroke="#fff" stroke-width="4" class="clickable" data-title="Línea de ataque" data-detail="Está a 3 m de la línea central."/><line x1="653.3" y1="100" x2="653.3" y2="405" stroke="#fff" stroke-width="4" class="clickable" data-title="Línea de ataque" data-detail="Está a 3 m de la línea central."/><rect x="444" y="100" width="12" height="305" fill="#fff" opacity=".8" class="clickable" data-title="Red" data-detail="9,50 m de largo × 1 m de ancho. Altura: 2,43 m masculina y 2,24 m femenina."/><circle cx="438" cy="100" r="8" fill="#244b39" class="clickable" data-title="Postes" data-detail="Altura aproximada: 2,55 m; se colocan fuera de las líneas laterales."/><circle cx="462" cy="405" r="8" fill="#244b39" class="clickable" data-title="Postes" data-detail="Altura aproximada: 2,55 m; se colocan fuera de las líneas laterales."/><g stroke="#244b39" stroke-width="2" fill="none"><path d="M145 75V92M755 75V92M145 83H755"/><path d="M112 100H132M112 405H132M120 100V405"/></g><g class="measure"><text x="450" y="68" text-anchor="middle">18 m</text><text x="105" y="255" text-anchor="middle" transform="rotate(-90 105 255)">9 m</text><text x="450" y="255" text-anchor="middle" transform="rotate(-90 450 255)">RED</text><text x="246" y="425" text-anchor="middle">3 m</text><text x="653" y="425" text-anchor="middle">3 m</text></g></svg></div><div class="legend"><span>18 × 9 m</span><span>Línea de ataque: 3 m</span><span>Red: 9,50 × 1 m</span><span>Red: 2,43 / 2,24 m de alto</span></div><div class="info" id="infoV"><strong>Selecciona una parte</strong><span>Haz clic con el mouse sobre la cancha, líneas, red, arco o área para ver sus medidas.</span></div></section></main><script>document.querySelectorAll(".clickable").forEach(e=>e.onclick=()=>{document.getElementById("infoV").innerHTML="<strong>"+e.dataset.title+"</strong><span>"+e.dataset.detail+"</span>"})</script></body></html>
